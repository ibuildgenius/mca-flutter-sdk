name: mca_official_flutter_sdk
description: The MyCover.ai SDK is a comprehensive Flutter plugin for buying insurance, supporting iOS and Android, with flexible payments, secure transactions, and a user-friendly interface.
version: 0.7.56
homepage: https://docs.mycover.ai/libraries-and-sdks/flutter
# Recommended for pub.dev
repository: https://github.com/<your-org>/<your-repo>

environment:
  sdk: ">=3.3.4 <4.0.0"
  flutter: ">=1.17.0"

# ✅ MUST be top-level (NOT under flutter:)
plugin:
  platforms:
    android:
      package: com.example.mca_official_flutter_sdk
      pluginClass: MyCoverAiPlugin
    ios:
      pluginClass: MyCoverAiPlugin

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.0.3
  dartz: ^0.10.1
  device_info_plus: ^10.1.0
  dio: ^5.4.3+1
  file_picker: ^8.0.3
  flutter_dotenv: ^5.1.0
  flutter_svg: ^2.0.10+1
  get_it: ^7.7.0
  intl: ^0.20.0
  permission_handler: ^11.3.1
  pin_code_fields: ^8.0.1
  pretty_dio_logger: ^1.3.1
  fluttertoast: ^8.2.5
  mockito: ^5.4.4
  hooks_riverpod: ^2.5.1
  internet_connection_checker: ^1.0.0+1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.1
  webview_flutter: ^4.8.0
  flutter_form_builder: ^10.2.0
  shimmer: ^3.0.0
  flutter_widget_from_html_core: ^0.15.1
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  lottie: ^3.1.2
  dotted_border: ^2.1.0
  pusher_channels_flutter: ^2.2.0
  dropdown_button2: ^2.3.9
  camera: ^0.11.0+1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  video_compress: ^3.1.2
  animated_toggle_switch: ^0.8.2
  flutter_dash: ^1.0.0
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  lints: ^3.0.0

flutter:
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/animations/

  fonts:
    - family: PhantomSans
      fonts:
        - asset: assets/fonts/PhantomSans-Regular.otf
        - asset: assets/fonts/PhantomSans-Medium.otf
          weight: 500
        - asset: assets/fonts/PhantomSans-SemiBold.otf
          weight: 600
